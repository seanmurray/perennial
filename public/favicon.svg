<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16241c"/>
      <stop offset="1" stop-color="#0b120e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- perennial sprout: stem with two leaves returning from the ground -->
  <path d="M256 448 V232" stroke="#34d399" stroke-width="26" stroke-linecap="round" fill="none"/>
  <path d="M256 300 C 256 220, 176 208, 128 216 C 132 288, 196 316, 256 300 Z"
        fill="url(#leaf)" stroke="#06210f" stroke-width="8" stroke-linejoin="round"/>
  <path d="M256 252 C 256 164, 340 150, 392 160 C 386 240, 316 270, 256 252 Z"
        fill="url(#leaf)" stroke="#06210f" stroke-width="8" stroke-linejoin="round"/>
  <!-- bud -->
  <circle cx="256" cy="120" r="34" fill="#fbbf24" stroke="#06210f" stroke-width="8"/>
  <!-- ground line -->
  <path d="M148 448 H364" stroke="#2a3830" stroke-width="18" stroke-linecap="round"/>
</svg>
